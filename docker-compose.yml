services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth-service/.env
  product-service:
    build: ./services/product-service
    ports:
      - "3002:3002"
    env_file:
      - ./services/product-service/.env
  order-service:
    build: ./services/order-service
    ports:
      - "3003:3003"
    env_file:
      - ./services/order-service/.env
